[workspace]
members = [".", "batdoc-core"]

[package]
name = "batdoc"
version = "1.5.0"
edition = "2021"
description = "cat(1) for doc, docx, xls, xlsx, pptx, pdf, and image files (OCR) -- renders to markdown with bat"
license = "MIT"
homepage = "https://github.com/daemonp/batdoc"
repository = "https://github.com/daemonp/batdoc"
readme = "README.md"
keywords = ["doc", "docx", "xlsx", "pptx", "pdf", "ocr", "image"]
categories = ["command-line-utilities"]

[[bin]]
name = "batdoc"
path = "src/main.rs"

[dependencies]
batdoc-core = { path = "batdoc-core" }
bat = { version = "0.26.1", default-features = false, features = ["regex-fancy", "paging"] }
is-terminal = "0.4"

[build-dependencies]
man = "0.3"

[profile.release]
strip = true
lto = "thin"

[package.metadata.deb]
maintainer = "Damon Petta <d@disassemble.net>"
copyright = "2025, Damon Petta <d@disassemble.net>"
license-file = ["LICENSE", "0"]
extended-description = "Reads legacy .doc and .xls, modern .docx, .xlsx, and .pptx, and PDF files and dumps their text to stdout. When stdout is a terminal the output is pretty-printed as syntax-highlighted markdown via bat; when piped, plain text is emitted. Format is detected by file signature, not extension. Raster image files are OCR'd with the ocrs engine; --ocr extends OCR to embedded DOCX/PPTX images and textless PDF pages. Spiritual successor to catdoc."
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    ["target/release/batdoc", "usr/bin/", "755"],
    ["target/man/batdoc.1", "usr/share/man/man1/batdoc.1", "644"],
    ["README.md", "usr/share/doc/batdoc/README", "644"],
]
