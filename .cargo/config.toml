# getrandom 0.4 (via lopdf → rand) selects its `wasm_js` backend from the
# `wasm_js` crate feature alone, enabled on the getrandom dependency in
# batdoc-core/Cargo.toml. No target rustflags are needed: the
# `getrandom_backend` cfg is inert for getrandom 0.4 (it only names that
# crate's non-`wasm_js` backends).
