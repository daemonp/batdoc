[package]
name = "batdoc-core"
version = "1.7.0"
edition = "2021"
description = "Document text extraction library — DOCX, XLSX, PPTX, DOC, XLS, PDF, and image OCR to plain text or Markdown"
license = "MIT"
repository = "https://github.com/daemonp/batdoc"
readme = "README.md"

[lib]
name = "batdoc_core"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
base64 = "0.22"
cfb = "0.13"
encoding_rs = "0.8"
# Pure-Rust PDF rasterizer for the textless/imageless (vector-outline) OCR
# fallback. `embed-fonts` supplies the 14 standard PDF fonts when a document
# does not embed them; `embed-cmaps` is left off (OCR is Latin-only).
hayro = { version = "0.7", default-features = false, features = ["embed-fonts"], optional = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"], optional = true }
lopdf = { version = "0.42", default-features = false }
ocrs = { version = "0.12", default-features = false, optional = true }
pdf-extract = "0.10"
quick-xml = "0.37"
rten = { version = "0.24", default-features = false, optional = true }
thiserror = "2"
ureq = { version = "2", optional = true }
zip = { version = "2", default-features = false, features = ["deflate"] }

[features]
default = ["net", "ocr"]
# Model download over HTTP. Disable (--no-default-features) for offline,
# embedded, or wasm targets where there is no socket/clock.
net = ["dep:ureq"]
# OCR inference (ocrs + rten engine + `image` decode). Disable for lean
# wasm/embedded builds that do not OCR images or textless PDFs.
ocr = ["dep:ocrs", "dep:rten", "dep:image", "dep:hayro"]
# Browser JS glue + `src/wasm.rs` exports (`detect` / `to_plain` / `to_markdown` /
# `to_sheets` / `to_sheets_stream`). Worker / rlib consumers leave this off.
wasm-bindgen = ["dep:wasm-bindgen", "dep:js-sys"]

# Password-protected OOXML decryption (MS-OFFCRYPTO). `crypto-ops` is the
# decrypt/encrypt half; `classify` (detection) is always present. Pinned to
# the RC line: the API may change before 0.1.0.
#
# Native only: the crate does not compile for wasm32-unknown-unknown (its
# `cfb` 0.14 dependency hands `std::time::SystemTime` to a `web_time` API
# there), so `office_crypto_bridge` carries wasm stubs instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
msoffice-crypto = { version = "=0.1.0-rc.5", default-features = false, features = ["crypto-ops"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# lopdf pulls getrandom 0.4 transitively (via rand); enable its wasm backend.
# The `wasm_js` feature alone selects that backend — no `getrandom_backend`
# rustflag is needed (see .cargo/config.toml).
getrandom = { version = "0.4", features = ["wasm_js"] }
# Only needed when the `wasm-bindgen` feature is on (browser demo).
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
lopdf = { version = "0.42", default-features = false }
# zip 2.x has no `write` feature (ZipWriter is unconditional); the `deflate`
# feature union matches the main dependency.
zip = { version = "2", default-features = false, features = ["deflate"] }
