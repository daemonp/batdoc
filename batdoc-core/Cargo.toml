[package]
name = "batdoc-core"
version = "1.4.0"
edition = "2021"
description = "Document text extraction library — DOCX, XLSX, PPTX, DOC, XLS, PDF to plain text or Markdown"
license = "MIT"
repository = "https://github.com/daemonp/batdoc"
readme = "README.md"

[lib]
name = "batdoc_core"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
cfb = "0.13"
encoding_rs = "0.8"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
lopdf = { version = "0.38", default-features = false }
ocrs = { version = "0.12", default-features = false }
pdf-extract = "0.10"
quick-xml = "0.37"
rten = { version = "0.24", default-features = false }
thiserror = "2"
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
lopdf = { version = "0.38", default-features = false }
# zip 2.x has no `write` feature (ZipWriter is unconditional); the `deflate`
# feature union matches the main dependency.
zip = { version = "2", default-features = false, features = ["deflate"] }
